<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CAU Helper - Riferimento Clinico">
<meta name="theme-color" content="#1E3A5F">
<title>CAU Helper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAU Helper">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F7F8FB;--sf:#fff;--sf2:#F1F5F9;--bd:#E2E8F0;--bdl:#EEF2F7;
  --tx:#0F172A;--tx2:#475569;--tx3:#94A3B8;
  --ac:#1E3A5F;--ach:#152D4A;--acl:#E8EEF6;
  --sc:#2563EB;--scl:#EFF6FF;
  --ok:#059669;--okl:#ECFDF5;--wn:#D97706;--wnl:#FFFBEB;--dg:#DC2626;--dgl:#FEF2F2;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-f:9999px;
  --sh-s:0 1px 3px rgba(15,23,42,.05);
  --sh-m:0 4px 16px rgba(15,23,42,.07),0 1px 3px rgba(15,23,42,.04);
  --sh-l:0 12px 40px rgba(15,23,42,.1),0 4px 12px rgba(15,23,42,.05);
  --ease:cubic-bezier(.4,0,.2,1);
  --font:'Figtree','Noto Sans',system-ui,-apple-system,sans-serif
}

/* ===== DARK MODE ===== */
[data-theme="dark"]{
  --bg:#0B1220;--sf:#141E2E;--sf2:#1C2840;--bd:#2C3A52;--bdl:#243149;
  --tx:#E6EDF7;--tx2:#A5B4CB;--tx3:#7386A1;
  --ac:#5C90D2;--ach:#74A4E0;--acl:#1A2942;
  --sc:#60A5FA;--scl:#152538;
  --ok:#34D399;--okl:#0E2A22;--wn:#FBBF24;--wnl:#2B2210;--dg:#F87171;--dgl:#2C1719;
  --sh-s:0 1px 3px rgba(0,0,0,.4);
  --sh-m:0 4px 16px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --sh-l:0 12px 40px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
  color-scheme:dark
}
[data-theme="dark"] mark{background:#7A6516;color:#FEF9C3}
[data-theme="dark"] .hdr{background:linear-gradient(145deg,#060D18 0%,#122439 50%,#17304C 100%)}
[data-theme="dark"] .bg-p{background:#33162A;color:#F9A8D4}
[data-theme="dark"] .bg-w{background:var(--wnl);color:var(--wn)}
[data-theme="dark"] .cs{background:#1E1B33;border-color:#3A3168}[data-theme="dark"] .cs h5{color:#C4B5FD}
[data-theme="dark"] .ce{background:#0E2A2E;border-color:#1F5560}[data-theme="dark"] .ce h5{color:#67E8F9}
[data-theme="dark"] .rf{background:#2A1517;border-color:#5A2A2E}[data-theme="dark"] .rf li{color:#FCA5A5}
[data-theme="dark"] .tn{background:#0E2A22;border-color:#1E5D45}[data-theme="dark"] .tn h5{color:#6EE7B7}
[data-theme="dark"] .tcs{background:#18212F;border-color:var(--bd);border-left-color:#7386A1}[data-theme="dark"] .tcs h5{color:#A5B4CB}
[data-theme="dark"] .tf{background:#16233A;border-color:#2E4266}
[data-theme="dark"] .tl{background:#0E2A22;border-color:#1E5D45}
[data-theme="dark"] .ad{background:#2C1719;border-color:#5C2B2F;color:#FCA5A5}
[data-theme="dark"] .aw{background:#2B2210;border-color:#5C4A15;color:#FCD34D}
[data-theme="dark"] .ao{background:var(--acl);border-color:#2E4266;color:#BFD4EF}
[data-theme="dark"] .rv{background:#2E1D0E;border-color:#6B3F16;color:#FDBA74}
[data-theme="dark"] .sc-result.r-low{background:#0E2A22;color:#6EE7B7;border-color:#1E5D45}
[data-theme="dark"] .sc-result.r-mod{background:#2B2210;color:#FCD34D;border-color:#5C4A15}
[data-theme="dark"] .sc-result.r-high{background:#2C1719;color:#FCA5A5;border-color:#5C2B2F}
[data-theme="dark"] .dg.no{background:var(--wnl);color:var(--wn)}
[data-theme="dark"] [class*="ci-"]{background:rgba(255,255,255,.07);filter:brightness(1.5) saturate(.85)}
[data-theme="dark"] .cp:hover,[data-theme="dark"] .scp:hover{color:#0B1220}

/* ===== CALCOLATORE DOSE / kg ===== */
.dz{display:inline-block;background:var(--scl);color:var(--sc);border:1px solid var(--sc);border-radius:6px;padding:0 6px;margin:0 3px;font-weight:800;font-size:.94em}
.wtb{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:var(--r-f);padding:4px 6px 4px 13px;transition:all .2s var(--ease)}
.wtb label{font:800 .66rem/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.5);cursor:pointer}
.wtb input{width:60px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-s);color:#fff;font:700 .82rem/1 var(--font);padding:6px 8px;outline:none;text-align:right;-moz-appearance:textfield}
.wtb input::-webkit-outer-spin-button,.wtb input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wtb input:focus{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.wtb .u{font:700 .72rem/1 var(--font);color:rgba(255,255,255,.55)}
.wtb.on{background:rgba(96,165,250,.24);border-color:rgba(96,165,250,.55)}
.wtb.on label{color:#BFDBFE}
.wtb.bad input{border-color:#F87171;background:rgba(248,113,113,.2)}
.wclr{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);width:22px;height:22px;border-radius:var(--r-f);cursor:pointer;font:700 .95rem/1 var(--font);display:grid;place-items:center;padding:0}
.wclr:hover{background:rgba(255,255,255,.25);color:#fff}
.dbn{display:flex;align-items:center;gap:10px;background:var(--scl);border:1px solid var(--sc);border-left:4px solid var(--sc);color:var(--sc);border-radius:var(--r-s);padding:11px 15px;margin-bottom:18px;font:600 .8rem/1.5 var(--font)}
.dbn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0}
.dbn b{font-weight:800}

/* ===== TEMA / PREFERITI / RECENTI ===== */
.hbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.7);width:38px;height:38px;border-radius:var(--r-m);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease);flex-shrink:0;padding:0}
.hbtn:hover{background:rgba(255,255,255,.16);color:#fff;transform:translateY(-1px)}
.hbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-act{display:flex;align-items:center;gap:8px;flex-shrink:0}
.favb{background:none;border:none;cursor:pointer;padding:3px;color:var(--tx3);display:grid;place-items:center;flex-shrink:0;border-radius:6px;transition:all .18s var(--ease)}
.favb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;pointer-events:none}
.favb:hover{color:#F59E0B;transform:scale(1.15)}
.favb.on{color:#F59E0B}.favb.on svg{fill:#F59E0B}
.qsec{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh-s)}
.qsec h4{font:800 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.qsec h4 svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.qsec h4 .fs{fill:#F59E0B;stroke:#F59E0B}
.qchips{display:flex;flex-wrap:wrap;gap:7px}
.qch{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);border-radius:var(--r-f);padding:6px 14px;font:600 .78rem/1 var(--font);cursor:pointer;transition:all .18s var(--ease);display:inline-flex;align-items:center;gap:6px}
.qch:hover{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-1px)}
.qch .pd{font-size:.68rem;opacity:.7;font-weight:700}
.pc.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}25%{box-shadow:0 0 0 4px rgba(37,99,235,.35)}}
@media(max-width:720px){.wtb{padding:4px 5px 4px 10px}.wtb label{display:none}.wtb input{width:52px}}

/* ===== RIQUADRO "IN SINTESI" ===== */
.syn{position:relative;background:linear-gradient(180deg,var(--acl) 0%,var(--sf) 130%);border:1.5px solid var(--ac);border-left:5px solid var(--ac);border-radius:var(--r-m);padding:15px 46px 15px 17px;margin-bottom:12px;box-shadow:var(--sh-m)}
.syn h5{font:800 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.1em;color:var(--ac);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.syn h5 svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.syn ul{list-style:none;padding:0;margin:0}
.syn li{font:600 .845rem/1.55 var(--font);color:var(--tx);padding:4px 0 4px 17px;position:relative}
.syn li::before{content:'';position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.syn li.rfl{color:var(--dg);font-weight:700;margin-top:7px;padding-top:9px;border-top:1px dashed var(--bd)}
.syn li.rfl::before{content:'\26A0';background:none;width:auto;height:auto;left:0;top:.55em;font-size:.85em;color:var(--dg)}
[data-theme="dark"] .syn{background:linear-gradient(180deg,#1A2942 0%,var(--sf) 130%)}
.pbfull{animation:fadeIn .28s var(--ease)}
.pbld{padding:22px;text-align:center;color:var(--tx3);font:600 .8rem/1 var(--font)}

/* ===== VEDI ANCHE / LINK FARMACO ===== */
.sa{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:12px 0 4px;padding-top:12px;border-top:1px dashed var(--bd)}
.sa .sal{font:800 .66rem/1 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-right:3px}
.sa button{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);border-radius:var(--r-f);padding:5px 12px;font:600 .74rem/1 var(--font);cursor:pointer;transition:all .18s var(--ease)}
.sa button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
a.fl{color:var(--sc);text-decoration:none;border-bottom:1.5px dotted var(--sc);font-weight:800;cursor:pointer}
a.fl:hover{background:var(--scl);border-bottom-style:solid}
.fhit{animation:fhit 1.8s var(--ease)}
@keyframes fhit{0%,100%{background:transparent}20%{background:var(--scl)}}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:var(--r-s)}
mark{background:#FEF08A;padding:1px 4px;border-radius:4px;font-weight:500}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:2000px}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* HEADER */
.hdr{background:linear-gradient(145deg,#0A1929 0%,#1E3A5F 50%,#264667 100%);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 2px 20px rgba(15,23,42,.25)}
.hdr-in{max-width:1320px;margin:0 auto;padding:16px 24px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-m{width:42px;height:42px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:var(--r-m);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.12);transition:transform .3s var(--ease)}.logo-m:hover{transform:scale(1.06)}.logo-m svg{width:22px;height:22px;fill:#fff}
.logo h1{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.2}
.logo span{font-size:.72rem;color:rgba(255,255,255,.5);font-weight:500;letter-spacing:.02em}
.srch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-m);padding:10px 16px;flex:1;max-width:480px;transition:all .25s var(--ease)}
.srch:focus-within{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.srch svg{width:18px;height:18px;fill:rgba(255,255,255,.4);flex-shrink:0}
.srch input{background:none;border:none;color:#fff;font:500 .875rem/1 var(--font);width:100%;outline:none}
.srch input::placeholder{color:rgba(255,255,255,.35)}
nav.nb{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.ni{padding:8px 20px;border-radius:var(--r-f);cursor:pointer;font:600 .8rem/1 var(--font);background:rgba(255,255,255,.06);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.06);transition:all .25s var(--ease);min-height:36px;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.ni:hover{background:rgba(255,255,255,.14);color:#fff;transform:translateY(-1px)}
.ni:active{transform:translateY(0) scale(.97)}
.ni[aria-selected="true"]{background:#fff;color:var(--ac);border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);font-weight:700}
.fb{display:flex;gap:6px;margin-top:10px;align-items:center}
.fc{padding:5px 14px;border-radius:var(--r-f);cursor:pointer;font:700 .72rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.06);transition:all .2s var(--ease)}
.fc:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.75)}
.fc[aria-pressed="true"]{background:rgba(255,255,255,.9);color:var(--ac);border-color:rgba(255,255,255,.9);font-weight:800}

/* MAIN */
.mn{max-width:1320px;margin:0 auto;padding:24px}
.sec{display:none;animation:fadeIn .3s var(--ease)}.sec.active{display:block}

/* CAT GROUP */
.cg{margin-bottom:14px;border-radius:var(--r-l);background:var(--sf);box-shadow:var(--sh-s);border:1px solid var(--bd);overflow:hidden;transition:all .3s var(--ease)}
.cg:hover{box-shadow:var(--sh-m)}
.ch{padding:16px 24px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:14px;transition:all .25s var(--ease);border-bottom:1px solid transparent}
.ch:hover{background:var(--sf2)}
.ch:active{transform:scale(.998)}
.cg.open .ch{border-bottom-color:var(--bdl);background:var(--sf2)}
.ci{width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;flex-shrink:0;transition:transform .3s var(--ease);font-size:1.2rem}.ci svg{width:22px;height:22px;stroke:currentColor;fill:none}
.cg.open .ci{transform:scale(1.06)}
.ch h2{font:700 .95rem/1.3 var(--font);flex:1;letter-spacing:-.02em;color:var(--tx)}
.cc{font:700 .72rem/1 var(--font);padding:4px 12px;border-radius:var(--r-f);background:var(--sf2);color:var(--tx2);transition:all .2s var(--ease)}
.cg.open .cc{background:var(--acl);color:var(--ac)}
.cv{width:20px;height:20px;fill:var(--tx3);transition:transform .35s var(--ease);flex-shrink:0}
.cg.open .cv{transform:rotate(180deg);fill:var(--ac)}
.cb{display:none;padding:8px 16px 16px}.cg.open .cb{display:block;animation:fadeIn .3s var(--ease)}

/* PAT CARD */
.pc{border:1px solid var(--bdl);border-radius:var(--r-m);margin-bottom:8px;transition:all .25s var(--ease);overflow:hidden;border-left:3px solid transparent}
.pc:hover{box-shadow:var(--sh-s);border-color:var(--bd);border-left-color:var(--bd)}
.pc.open{border-color:var(--ac);border-left:3px solid var(--ac);box-shadow:0 2px 12px rgba(30,58,95,.08)}
.ph{padding:12px 16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;transition:all .2s var(--ease);min-height:44px}
.ph:hover{background:var(--sf2)}
.ph:active{transform:scale(.998)}
.ph h3{font:600 .875rem/1.3 var(--font);flex:1;transition:color .2s}
.pc.open .ph h3{color:var(--ac)}
.pv{width:16px;height:16px;fill:var(--tx3);transition:all .3s var(--ease);flex-shrink:0}
.pc.open .pv{transform:rotate(180deg);fill:var(--ac)}
.pb{display:none;padding:0 16px 16px}.pc.open .pb{display:block;animation:fadeIn .3s var(--ease)}

/* BADGES */
.bg{font:700 .68rem/1 var(--font);padding:3px 10px;border-radius:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.bg-a{background:var(--acl);color:var(--ac)}.bg-p{background:#FDF2F8;color:#BE185D}
.bg-d{background:var(--dgl);color:var(--dg)}.bg-w{background:var(--wnl);color:#92400E}

/* CLINICAL */
.wu{background:var(--sf2);border:1px solid var(--bdl);border-radius:var(--r-s);padding:12px 16px;font-size:.82rem;color:var(--tx2);margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;line-height:1.6;border-left:3px solid var(--ac)}
.wu strong{color:var(--tx);font-weight:700}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cx{border-radius:var(--r-s);padding:16px;font-size:.82rem;line-height:1.7}
.cx h5{font:700 .7rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cx ul{padding-left:18px;margin:0}.cx li{margin-bottom:3px}
.cs{background:#F5F3FF;border:1px solid #DDD6FE}.cs h5{color:#6D28D9}
.ce{background:#ECFEFF;border:1px solid #A5F3FC}.ce h5{color:#0E7490}
.rf{background:#FFF5F5;border:1px solid #FED7D7;border-radius:var(--r-s);padding:16px;margin-bottom:16px;font-size:.82rem;line-height:1.6;border-left:3px solid var(--dg)}
.rf h5{font:700 .7rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--dg);margin-bottom:10px}
.rf ul{padding-left:18px;margin:0}.rf li{margin-bottom:3px;color:#991B1B}
.sl{font:700 .7rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--bdl)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tx{border-radius:var(--r-s);padding:16px;font-size:.82rem;line-height:1.7}
.tx h5{font:700 .7rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tx h5 .dt{width:8px;height:8px;border-radius:var(--r-f);flex-shrink:0}
.tf{background:#EFF3FA;border:1px solid #D4DFEF}.tf h5{color:var(--ac)}.tf h5 .dt{background:var(--ac)}
.tl{background:#F0FAF4;border:1px solid #BBF7D0}.tl h5{color:var(--ok)}.tl h5 .dt{background:var(--ok)}
.ab{border-radius:var(--r-s);padding:12px 16px;margin-top:10px;font-size:.82rem;line-height:1.6;display:flex;align-items:flex-start;gap:10px}
.ab .ai{font-size:1rem;flex-shrink:0;margin-top:1px}
.ad{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-left:3px solid var(--dg)}
.aw{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-left:3px solid var(--wn)}
.ao{background:var(--acl);border:1px solid #C7D2FE;color:#1E3A5F;border-left:3px solid var(--ac)}
.rv{background:#FFF7ED;border:1px solid #FED7AA;border-radius:var(--r-s);padding:12px 16px;margin-top:10px;font-size:.82rem;color:#9A3412;display:flex;gap:10px;border-left:3px solid #F97316}
.cp{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--font);padding:8px 18px;border:1px solid var(--bd);background:var(--sf);border-radius:var(--r-f);cursor:pointer;color:var(--tx2);transition:all .25s var(--ease);margin-top:12px}
.cp:hover{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(30,58,95,.2);transform:translateY(-1px)}.cp:active{transform:translateY(0) scale(.96)}
.ci-endo{background:#FEF2F2;color:#B45309}
/* COPIA PER SEZIONE */
.wu,.cx,.rf,.tx,.rv,.tn,.tcs{position:relative;padding-right:44px}
.scp{position:absolute;top:7px;right:7px;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--bdl);background:var(--sf);border-radius:8px;cursor:pointer;color:var(--tx3);opacity:.5;transition:all .18s var(--ease);padding:0;z-index:2}
.scp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.wu:hover .scp,.cx:hover .scp,.rf:hover .scp,.tx:hover .scp,.rv:hover .scp,.tn:hover .scp,.tcs:hover .scp,.tf-old:hover .scp,.syn:hover .scp{opacity:1}
.syn .scp{opacity:.6;border-color:var(--ac);color:var(--ac)}
.pbf:empty{display:none}
.scp:hover{background:var(--ac);color:#fff;border-color:var(--ac);opacity:1;transform:scale(1.08)}
.scp:active{transform:scale(.92)}
.scp:focus-visible{opacity:1;outline:2px solid var(--ac);outline-offset:2px}
.scp.done{background:var(--ok);color:#fff;border-color:var(--ok);opacity:1}
.scp.err{background:var(--dg);color:#fff;border-color:var(--dg);opacity:1}
.tf-old .tfb{position:relative}
@media(hover:none){.scp{opacity:.8}}
.cx h5,.rf h5,.tx h5,.tn h5,.tcs h5{padding-right:4px}
/* TERAPIA CONSIGLIATA (LG) + CONSIGLI */
.tn{background:#F0FAF4;border:1px solid #A7F3D0;border-left:3px solid var(--ok);border-radius:var(--r-s);padding:16px 44px 16px 16px;font-size:.82rem;line-height:1.65;margin-bottom:10px}
.tn h5{font:700 .7rem/1.3 var(--font);text-transform:uppercase;letter-spacing:.06em;color:#047857;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tn h5 .dt{width:8px;height:8px;border-radius:var(--r-f);background:var(--ok);flex-shrink:0}
.tn ul,.tcs ul{padding-left:17px;margin:0}
.tn li{margin-bottom:6px}
.tcs{background:#F8FAFC;border:1px solid var(--bdl);border-left:3px solid #64748B;border-radius:var(--r-s);padding:16px 44px 16px 16px;font-size:.82rem;line-height:1.65;margin-bottom:10px}
.tcs h5{font:700 .7rem/1.3 var(--font);text-transform:uppercase;letter-spacing:.06em;color:#475569;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tcs h5 .dt{width:8px;height:8px;border-radius:var(--r-f);background:#64748B;flex-shrink:0}
.tcs li{margin-bottom:6px}
.mi{background:var(--sf2);border:1px solid var(--bdl);border-left:3px solid var(--bdl);border-radius:var(--r-s);font-size:.82rem;line-height:1.65;color:var(--tx2);margin:0 0 10px;position:relative}
.mi summary{cursor:pointer;padding:11px 44px 11px 14px;font:600 .72rem/1.3 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.mi summary::-webkit-details-marker{display:none}
.mi summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s var(--ease);flex-shrink:0;margin-left:2px}
.mi[open] summary::after{transform:rotate(45deg)}
.mi[open]{border-left-color:var(--ac)}
.mi summary:hover{color:var(--tx2)}
.mi summary .mic{margin-left:auto;font-size:.68rem;font-weight:500;text-transform:none;letter-spacing:0;color:var(--tx3);opacity:.8}
.mi .mib{padding:0 44px 12px 14px}
.mi .mib ul{margin:0;padding-left:17px}
.mi .mib li{margin-bottom:7px}
.mi:hover .scp{opacity:1}
.tf-old{background:var(--sf2);border:1px solid var(--bdl);border-radius:var(--r-s);font-size:.8rem;line-height:1.6;color:var(--tx2);margin-bottom:10px;position:relative}
.tf-old summary{cursor:pointer;padding:10px 44px 10px 14px;font:600 .7rem/1.3 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.tf-old summary::-webkit-details-marker{display:none}
.tf-old summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s var(--ease);flex-shrink:0}
.tf-old[open] summary::before{transform:rotate(45deg)}
.tf-old summary:hover{color:var(--tx2)}
.tf-old .tfb{padding:0 44px 14px 14px}
/* BARRA COPIA */
.cpr{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bdl)}
.cpr .cp{margin-top:0}
.cp-1{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}

/* DRUG */
.di{background:var(--sf);border:1px solid var(--bdl);border-radius:var(--r-m);padding:16px 18px;margin-bottom:8px;transition:all .25s var(--ease)}
.di:hover{box-shadow:var(--sh-m);border-color:var(--bd);transform:translateY(-1px)}.di.fl{border-left:3px solid var(--wn)}
.dn{font:700 .95rem/1.3 var(--font);color:var(--ac)}
.ds{font-size:.82rem;color:var(--tx3);margin-top:3px}
.dd{font-size:.82rem;margin-top:8px}.dd b{color:var(--tx);font-weight:600}
.dw{font-size:.82rem;color:var(--dg);margin-top:8px;font-weight:600}
.dg{font-size:.72rem;margin-top:8px;padding:4px 12px;border-radius:var(--r-f);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.dg.go{background:var(--okl);color:var(--ok)}.dg.no{background:var(--wnl);color:#92400E}

/* SCORE */
.sc{background:var(--sf);border:1px solid var(--bdl);border-radius:var(--r-l);padding:24px;margin-bottom:16px;box-shadow:var(--sh-s);transition:box-shadow .3s var(--ease)}
.sc:hover{box-shadow:var(--sh-m)}
.sc h3{font:700 1rem/1.3 var(--font);color:var(--tx);margin-bottom:4px}
.sc .sd{font-size:.82rem;color:var(--tx2);margin-bottom:16px}
.sc-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border:1px solid var(--bdl);border-radius:var(--r-s);margin-bottom:6px;cursor:pointer;transition:all .2s var(--ease);user-select:none;font-size:.84rem}
.sc-row:hover{background:var(--sf2);border-color:var(--bd)}
.sc-row.checked{background:var(--acl);border-color:var(--ac);color:var(--ac);font-weight:600}
.sc-row .sc-pts{font:700 .75rem/1 var(--font);padding:3px 10px;border-radius:var(--r-f);background:var(--sf2);color:var(--tx3);min-width:32px;text-align:center;transition:all .2s}
.sc-row.checked .sc-pts{background:var(--ac);color:#fff}
.sc-lbl{flex:1}
.sc-result{margin-top:16px;padding:18px;border-radius:var(--r-m);font-size:.85rem;line-height:1.5;text-align:center;transition:all .3s var(--ease);font-weight:600}
.sc-result.r-low{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.sc-result.r-mod{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.sc-result.r-high{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.sc-result.r-none{background:var(--sf2);color:var(--tx3);border:1px solid var(--bdl)}
.sc-total{font:800 1.8rem/1 var(--font);display:block;margin-bottom:4px}
.sc-select{width:100%;padding:9px 14px;border:1px solid var(--bdl);border-radius:var(--r-s);font:500 .84rem/1.3 var(--font);color:var(--tx);background:var(--sf);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.sc-select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(30,58,95,.1)}
.sc-input{width:80px;padding:9px 14px;border:1px solid var(--bdl);border-radius:var(--r-s);font:500 .84rem/1 var(--font);color:var(--tx);text-align:center;transition:border-color .2s}
.sc-input:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 3px rgba(30,58,95,.1)}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
@media(max-width:480px){.sc-grid{grid-template-columns:1fr}}
.sc-sep{font:700 .72rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bdl)}

/* PATHWAY */
.pw{background:var(--sf2);border-radius:var(--r-s);padding:16px;margin-bottom:8px}
.pw h4{font:700 .875rem/1.3 var(--font);color:var(--ac);margin-bottom:8px}
.pw p,.pw li{font-size:.82rem}.pw ul{padding-left:20px}
.st{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.sn{background:var(--ac);color:#fff;width:24px;height:24px;border-radius:var(--r-f);display:grid;place-items:center;font:800 .72rem/1 var(--font);flex-shrink:0}
.it{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem;margin:8px 0;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--bd)}
.it th{background:var(--ac);color:#fff;padding:10px 16px;text-align:left;font:600 .82rem/1.3 var(--font)}
.it td{padding:10px 16px;border-bottom:1px solid var(--bdl)}.it tr:last-child td{border-bottom:none}.it tr:hover td{background:var(--acl)}

/* CAT COLORS */
.ci-cardio{background:#FEE2E2;color:#DC2626}.ci-derm{background:#FCE7F3;color:#DB2777}
.ci-gastro{background:#FEF3C7;color:#D97706}.ci-pneumo{background:#DBEAFE;color:#2563EB}
.ci-neuro{background:#EDE9FE;color:#7C3AED}.ci-orl{background:#CCFBF1;color:#0D9488}
.ci-orto{background:#FED7AA;color:#EA580C}.ci-trauma{background:#E0E7FF;color:#4338CA}
.ci-uro{background:#CFFAFE;color:#0891B2}.ci-oftalm{background:#E0F2FE;color:#0284C7}
.ci-infett{background:#FEF9C3;color:#A16207}.ci-gine{background:#FCE7F3;color:#BE185D}
.ci-emat{background:#FFE4E6;color:#E11D48}.ci-psic{background:#F3E8FF;color:#9333EA}
.ci-proct{background:#FFF1F2;color:#BE123C}.ci-odont{background:#F0FDF4;color:#16A34A}
.ci-other{background:#F1F5F9;color:#475569}

/* NORES */
.nr{text-align:center;padding:80px 20px;color:var(--tx3)}
.nr svg{width:56px;height:56px;fill:var(--bd);margin-bottom:14px}.nr p{font:500 .95rem/1 var(--font)}

/* RESPONSIVE */
@media(max-width:1024px){.mn{padding:16px}}
@media(max-width:768px){.hdr-in{padding:12px 16px}.hdr-top{flex-direction:column;align-items:stretch}.srch{max-width:100%}.cg2,.tg{grid-template-columns:1fr}.ch{padding:12px 16px}.ci{width:38px;height:38px}}
@media(max-width:480px){.nb{gap:4px}.ni{padding:7px 14px;font-size:.72rem}.ph{padding:10px 12px}.pb{padding:0 12px 12px}.ch{padding:10px 12px}.sc{padding:16px}}

/* LOGIN */
.login-overlay {
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(145deg,#0A1929 0%,#1E3A5F 45%,#2D5A8E 100%);
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.login-card {
  background:rgba(255,255,255,.97);backdrop-filter:blur(24px);border-radius:24px;
  padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 32px 80px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.08);text-align:center;
  animation:loginUp .5s cubic-bezier(.22,1,.36,1);
}
@keyframes loginUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo {
  width:64px;height:64px;background:linear-gradient(135deg,#1E3A5F,#2563EB);border-radius:18px;
  display:grid;place-items:center;font-size:1.8rem;color:#fff;font-weight:800;
  margin:0 auto 20px;box-shadow:0 8px 24px rgba(30,58,95,.25);
}
.login-card h2{font:800 1.4rem/1.2 var(--font);color:var(--tx);letter-spacing:-.03em;margin-bottom:6px}
.login-card p{font:400 .85rem/1.5 var(--font);color:var(--tx2);margin-bottom:28px}
.login-field{position:relative;margin-bottom:16px}
.login-field input{width:100%;padding:14px 18px 14px 48px;border:2px solid var(--bd);border-radius:14px;font:500 .95rem/1 var(--font);color:var(--tx);background:var(--sf);outline:none;transition:border-color .2s,box-shadow .2s}
.login-field input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(30,58,95,.1)}
.login-field input::placeholder{color:var(--tx3)}
.login-field .fi{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:var(--tx3)}
.login-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#1E3A5F,#2563EB);color:#fff;font:700 .95rem/1 var(--font);cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(30,58,95,.25)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(30,58,95,.35)}
.login-btn:active{transform:translateY(0) scale(.98)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{font:600 .8rem/1.4 var(--font);color:var(--dg);margin-top:12px;min-height:20px}
.login-hint{font:400 .72rem/1.4 var(--font);color:var(--tx3);margin-top:20px}
.login-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.login-card{padding:36px 24px;margin:16px;border-radius:20px}}

</style>
</head>
<body>

<div class="login-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="#fff"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></div>

<div class="login-field">

</form>
<div class="login-hint">Dati protetti con crittografia AES-256</div>
</div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-cv" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
<symbol id="i-cp" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>
<header class="hdr" role="banner"><div class="hdr-in">
<div class="hdr-top">
<div class="logo"><div class="logo-m" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></div><div><h1>CAU Helper</h1><span>Riferimento Clinico</span></div></div>

<input type="text" id="si" placeholder="Cerca patologia, farmaco, sintomo..." aria-label="Cerca nella knowledge base" oninput="A.hs(this.value)"></div>

</div>
</div></header>

<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

</div>
</main>

const VERIFY_TOKEN = "k4997osJ3prIBvbySTV2nDf8KhdpDKae44cx+YxwWBEYVU+AkjaGPO3Lc11NdbFV";

/* CRYPTO */
async function deriveKey(password, salt) {
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
}

async function verifyPassword(password) {
  var raw = Uint8Array.from(atob(VERIFY_TOKEN), function(c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16);
  var expectedHash = raw.slice(16);
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  var derivedBits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, 256
  );
  var derived = new Uint8Array(derivedBits);
  return derived.every(function(b, i) { return b === expectedHash[i]; });
}

async function decryptData(password) {
  var raw = Uint8Array.from(atob(ENCRYPTED_PAYLOAD), function(c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16);
  var iv = raw.slice(16, 28);
  var ciphertext = raw.slice(28);
  var key = await deriveKey(password, salt);
  var decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
  var bytes = new Uint8Array(decrypted);
  // payload compresso gzip (magic 1f 8b): decomprimi via DecompressionStream
  if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("Browser non supportato: aggiornare il browser (serve DecompressionStream)");
    }
    var ds = new DecompressionStream("gzip");
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }
  return new TextDecoder().decode(decrypted);
}

/* LOGIN */
async function handleLogin() {
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('loginError');
  if (!pass) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="login-spinner"></span>Verifica...';
  errEl.innerHTML = '&nbsp;';

  try {
    var valid = await verifyPassword(pass);
    if (!valid) {
      errEl.textContent = 'Password non corretta';
      btn.disabled = false;
      btn.textContent = 'Accedi';
      document.getElementById('loginPass').select();
      return;
    }

    btn.innerHTML = '<span class="login-spinner"></span>Decifratura...';
    var dataJs = await decryptData(pass);

    // Replace const with var for global scope eval
    dataJs = dataJs.replace(/\bconst\b/g, 'var');

    // Execute at global scope
    (0, eval)(dataJs);

    // Save to session (persists until browser closes)
    sessionStorage.setItem('cau_pass', pass);

    // Hide login, show app
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';

    // Start the app rendering
    startApp();

  } catch (err) {
    console.error('Login error:', err);
    errEl.textContent = 'Errore: ' + err.message;
    btn.disabled = false;
    btn.textContent = 'Accedi';
  }
}

// Attach login handler
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  handleLogin();
});

// Auto-login if session exists
(async function() {
  var saved = sessionStorage.getItem('cau_pass');
  if (!saved) return;
  try {
    var valid = await verifyPassword(saved);
    if (!valid) { sessionStorage.removeItem('cau_pass'); return; }
    var dataJs = await decryptData(saved);
    dataJs = dataJs.replace(/\bconst\b/g, 'var');
    (0, eval)(dataJs);
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    startApp();
  } catch(e) { sessionStorage.removeItem('cau_pass'); }
})();

function hl(t,q){
  if(!q||q.length<2||!t)return t;
  const s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),re=new RegExp('('+s+')','gi');
  return String(t).split(/(<[^>]*>)/).map(g=>g.charAt(0)==='<'?g:g.replace(re,'<mark>$1</mark>')).join('');
}

function pnum(s){return parseFloat(String(s).replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'))}
function nfmt(v){
  if(!isFinite(v))return '';
  const r=v>=100?Math.round(v):v>=10?Math.round(v*10)/10:Math.round(v*100)/100;
  return String(r).replace('.',',');

const RE_CONC=/(\d[\d.]*(?:,\d+)?)\s*(mg|mcg|g|UI)\s*\/\s*(\d+(?:[.,]\d+)?)?\s*ml\b/i;
/* annota ogni espressione mg/kg con la dose reale per il peso impostato */
/* il numero di dosi vale solo se indicato SUBITO DOPO l'espressione mg/kg: una riga
   puo elencare piu farmaci con frazionamenti diversi (o monodose). Se il numero e a
   sua volta un intervallo ("in 2-3 dosi") non si frazionna: la dose singola sarebbe ambigua. */
const RE_ND=/^[^.;]{0,30}?\bin\s+(\d)\s+(?:dosi|somministrazioni)/i;
function dk(t,html){
  const kg=A.kg,str=String(t);
  if(!kg||!t||str.indexOf('/kg')<0&&str.indexOf('/ kg')<0)return t;
  const c=RE_CONC.exec(str);
  let cq=null,cu=null,cml=1;
  if(c){cq=pnum(c[1]);cu=c[2].toLowerCase();cml=c[3]?pnum(c[3]):1}
  const conv=v=>(cq&&cu&&!isNaN(v))?v/cq*cml:null;
  RE_KG.lastIndex=0;
  return str.replace(RE_KG,function(m,a,b,u,per,off){
    const uu=u.toLowerCase();
    const lo=pnum(a)*kg,hi=b?pnum(b)*kg:null;
    if(!isFinite(lo))return m;
    const nx=per?RE_ND.exec(str.slice(off+m.length)):null,nd=nx?parseInt(nx[1],10):0;
    const cok=cq&&cu===uu&&uu!=='ml',split=nd>1;
    let s=nfmt(lo)+(hi!=null?'-'+nfmt(hi):'')+' '+u+(per?'/die':'');
    /* se la dose giornaliera va frazionata, la conversione in ml serve sulla singola dose */
    if(cok&&!split){const q1=conv(lo),q2=hi!=null?conv(hi):null;s+=' = '+nfmt(q1)+(q2!=null?'-'+nfmt(q2):'')+' ml'}
    if(split){
      const p1=lo/nd,p2=hi!=null?hi/nd:null;
      s+=' = '+nd+' dosi da '+nfmt(p1)+(p2!=null?'-'+nfmt(p2):'')+' '+u;
      if(cok){const r1=conv(p1),r2=p2!=null?conv(p2):null;s+=' ('+nfmt(r1)+(r2!=null?'-'+nfmt(r2):'')+' ml)'}
    }
    const tag='= '+s;
    return m+(html?' <span class="dz">'+tag+'</span>':' ['+tag+']');
  });
}

let FMAP=null,FRE=null;
function buildFidx(){
  FMAP=new Map();
  FARM.forEach(function(f,i){
    const ks=[];
    ks.push(f.n.toUpperCase());
    f.n.toUpperCase().split(/\s+/).forEach(w=>{if(w.length>4)ks.push(w)});
    if(f.g)f.g.toUpperCase().split(/[+\/ ]/).forEach(w=>{w=w.replace(/[^A-Z0-9-]/g,'');if(w.length>5)ks.push(w)});
    ks.forEach(k=>{if(!FMAP.has(k))FMAP.set(k,i)});
  });
  const keys=[...FMAP.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\-]/g,'\\$&'));
  FRE=new RegExp('\\b('+keys.join('|')+')\\b','g');
}
/* solo maiuscolo: non tocca gli attributi HTML, che sono minuscoli */
function flk(t){
  if(!FRE||!t)return t;
  FRE.lastIndex=0;

    const i=FMAP.get(m);
    return i==null?m:'<a class="fl" href="#" onclick="A.gof('+i+');return false" title="Apri la scheda di '+m+' nel prontuario">'+m+'</a>';

}

function qexp(q){
  const o=[q];
  if(q.length<3)return o;
  for(const k in SYN){
    if(k.indexOf(q)>=0||q.indexOf(k)>=0)SYN[k].split(' ').forEach(v=>{if(o.indexOf(v)<0)o.push(v)});
  }

}
function anyq(arr,terms){

    for(let j=0;j<arr.length;j++){if(arr[j]&&arr[j].toLowerCase().indexOf(t)>=0)return true}}
  return false;
}

  const q=fi.toLowerCase(),fs=data.filter(c=>fi.length<2||mq(c.n,q)||mq(c.h,q));
  if(!fs.length)return'';const gr={};fs.forEach(c=>{if(!gr[c.cat])gr[c.cat]=[];gr[c.cat].push(c)});
  let h='';for(const[cat,items]of Object.entries(gr)){
    const o=fi.length>=2?' open':'';
    h+=`<div class="cg${o}"><div class="ch" onclick="te(this)" role="button"><div class="ci ci-other" aria-hidden="true">&#10070;</div><h2>${cat}</h2><span class="cc">${items.length}</span>${CV}</div><div class="cb">`;
    items.forEach(c=>{const co=fi.length>=2?' open':'';h+=`<div class="pc${co}"><div class="ph" onclick="te(this)" role="button"><h3>${hl(c.n,fi)}</h3>${PV}</div><div class="pb">${c.h}</div></div>`});
    h+='</div></div>'}return h}

function rS(data,fi){
  const q=fi.toLowerCase(),fs=data.filter(s=>fi.length<2||mq(s.n,q)||mq(s.d,q)||(s.cat&&mq(s.cat,q)));
  if(!fs.length)return'';
  const gr={};fs.forEach(s=>{const c=s.cat||'Altro';if(!gr[c])gr[c]=[];gr[c].push(s)});
  let h='';
  for(const[cat,items]of Object.entries(gr)){
    const o=fi.length>=2?' open':'';
    h+=`<div class="cg${o}"><div class="ch" onclick="te(this)" role="button"><div class="ci ci-other" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg></div><h2>${cat}</h2><span class="cc">${items.length}</span>${CV}</div><div class="cb">`;
    items.forEach(s=>{
      const sid=s.id||s.n.replace(/[^a-zA-Z0-9]/g,'');
      const so=fi.length>=2?' open':'';
      h+=`<div class="pc${so}"><div class="ph" onclick="te(this)" role="button" aria-expanded="${so?'true':'false'}"><h3>${hl(s.n,fi)}</h3><span class="bg bg-a">${hl(s.d,fi)}</span>${PV}</div><div class="pb"><div class="sc" id="sc_${sid}">${s.h}</div></div></div>`;
    });
    h+='</div></div>';
  }
  return h}

function calcScore(id){
  const el=document.getElementById('sc_'+id);if(!el)return;
  let total=0;
  el.querySelectorAll('.sc-row.checked').forEach(r=>{total+=parseFloat(r.dataset.pts||0)});
  el.querySelectorAll('.sc-select').forEach(sel=>{total+=parseFloat(sel.value||0)});
  el.querySelectorAll('.sc-input').forEach(inp=>{
    const v=parseFloat(inp.value)||0;
    const fn=inp.dataset.fn;
    if(fn&&window[fn])total+=window[fn](v);
  });
  const res=el.querySelector('.sc-result');
  const tot=el.querySelector('.sc-total');
  if(tot)tot.textContent=total;
  if(res&&res.dataset.ranges){
    const ranges=JSON.parse(res.dataset.ranges);
    let cls='r-low',txt='';
    for(const r of ranges){if(total>=r.min){cls=r.cls;txt=r.txt}}
    res.className='sc-result '+cls;
    if(tot)tot.textContent=total;
    res.querySelector('.sc-txt').textContent=txt;
  }
}
function toggleRow(el,id){el.classList.toggle('checked');calcScore(id)}
function selChange(id){calcScore(id)}
function calcSI(){
  const fc=parseFloat(document.getElementById('si_fc')?.value)||0;
  const pas=parseFloat(document.getElementById('si_pas')?.value)||0;
  const res=document.getElementById('si_res');
  const val=document.getElementById('si_val');
  const txt=document.getElementById('si_txt');
  if(!fc||!pas){val.textContent='-';txt.textContent='Inserisci FC e PAS';res.className='sc-result r-none';return}
  const si=(fc/pas).toFixed(2);
  val.textContent=si;
  if(si<=0.7){res.className='sc-result r-low';txt.textContent='Normale (0.5-0.7)'}
  else if(si<=1.0){res.className='sc-result r-mod';txt.textContent='Shock compensato iniziale (0.7-1.0)'}
  else if(si<=1.5){res.className='sc-result r-high';txt.textContent='Shock significativo (1.0-1.5) - Rianimazione aggressiva'}
  else{res.className='sc-result r-high';txt.textContent='Shock severo (>1.5) - Intervento IMMEDIATO'}
}

let PATI=new Map();
const ICO_SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICO_MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const ICO_CLOCK='<svg aria-hidden="true"><use href="#i-clock"/></svg>';

const A={
  s:'patologie',a:'all',t:null,lq:'',kg:0,
  fav:lsG('fav',[]),rec:lsG('rec',[]),
  expAll(){document.querySelectorAll('.pbf').forEach(el=>{if(!el.dataset.done)this.fill(el)});document.querySelectorAll('.cg,.pc').forEach(el=>el.classList.add('open'))},
  colAll(){document.querySelectorAll('.cg,.pc').forEach(el=>el.classList.remove('open'))},

  /* --- tema --- */
  theme(t){
    const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
    const nw=t||(cur==='dark'?'light':'dark');
    document.documentElement.setAttribute('data-theme',nw);lsS('theme',nw);
    const b=document.getElementById('thb');if(b)b.innerHTML=nw==='dark'?ICO_SUN:ICO_MOON;
    const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',nw==='dark'?'#060D18':'#1E3A5F');
  },

  /* --- calcolatore dose per peso --- */
  setKg(v){
    const box=document.getElementById('wtb'),inp=document.getElementById('wkg'),clr=document.getElementById('wclr'),bn=document.getElementById('dbn');
    const n=parseFloat(String(v).replace(',','.'));
    const ok=isFinite(n)&&n>=0.5&&n<=200;
    this.kg=ok?n:0;
    if(inp&&inp.value!==String(v))inp.value=v;
    box.classList.toggle('on',!!this.kg);
    box.classList.toggle('bad',String(v).trim()!==''&&!ok);
    clr.style.display=String(v).trim()===''?'none':'grid';
    if(this.kg){
      bn.innerHTML=ICO_BOLT+'<span>Dosi calcolate per <b>'+this.kg+' kg</b>. I valori fra parentesi sono gia convertiti in mg e ml. <b>Verificare sempre il calcolo prima di prescrivere.</b></span>';
      bn.classList.remove('hidden');
    }else bn.classList.add('hidden');
    lsS('kg',this.kg||'');
    this.r();
  },

  /* --- preferiti e recenti --- */
  fv(e,i){
    e.stopPropagation();
    const p=PAT[i],k=p.n+'|'+p.a,x=this.fav.indexOf(k);
    if(x>=0)this.fav.splice(x,1);else this.fav.push(k);
    lsS('fav',this.fav);
    e.currentTarget.classList.toggle('on',x<0);
    this.quick();
  },
  note(i){
    const p=PAT[i],k=p.n+'|'+p.a,x=this.rec.indexOf(k);
    if(x>=0)this.rec.splice(x,1);
    this.rec.unshift(k);if(this.rec.length>8)this.rec.length=8;
    lsS('rec',this.rec);
  },
  quick(){
    const el=document.getElementById('qb');if(!el)return;
    if(this.s!=='patologie'||document.getElementById('si').value.trim().length>=2){el.innerHTML='';return}
    const chip=k=>{const[n,a]=k.split('|'),j=findPat(n,a);
      return j<0?'':`<button class="qch" onclick="A.jump(${j})">${n}${a==='pediatrico'?' <span class="pd">ped</span>':''}</button>`};
    let h='';
    if(this.fav.length)h+=`<div class="qsec"><h4>${'<svg class="fs" aria-hidden="true"><use href="#i-star"/></svg>'}Preferiti</h4><div class="qchips">${this.fav.map(chip).join('')}</div></div>`;
    if(this.rec.length)h+=`<div class="qsec"><h4>${ICO_CLOCK}Consultate di recente</h4><div class="qchips">${this.rec.map(chip).join('')}</div></div>`;
    el.innerHTML=h;
  },

  /* --- apertura scheda: il corpo completo si costruisce solo ora --- */
  fill(el){
    if(!el||el.dataset.done)return;
    el.innerHTML=patBody(+el.dataset.i,document.getElementById('si').value.trim());
    el.dataset.done='1';el.classList.add('pbfull');
  },
  op(hd,i){
    const pc=hd.parentElement,willOpen=!pc.classList.contains('open');
    if(willOpen)this.fill(pc.querySelector('.pbf'));
    pc.classList.toggle('open');hd.setAttribute('aria-expanded',willOpen?'true':'false');
    if(willOpen)this.note(i);
  },
  jump(i){
    if(this.s!=='patologie'){this.go('patologie')}
    const si=document.getElementById('si');
    if(si.value.trim().length>=2){si.value='';this.lq='';this.r('')}
    const el=document.getElementById('pc'+i);if(!el)return;
    const cg=el.closest('.cg');if(cg)cg.classList.add('open');
    this.fill(el.querySelector('.pbf'));
    el.classList.add('open','flash');
    const hd=el.querySelector('.ph');if(hd)hd.setAttribute('aria-expanded','true');
    this.note(i);
    setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');
      setTimeout(()=>el.classList.add('flash'),20)},30);
  },
  /* apre la scheda farmaco dal link dentro una terapia */
  gof(i){
    this.go('farmaci');
    setTimeout(()=>{const el=document.getElementById('fm'+i);
      if(el){const cg=el.closest('.cg');if(cg)cg.classList.add('open');
        el.scrollIntoView({behavior:'smooth',block:'center'});
        el.classList.add('fhit');setTimeout(()=>el.classList.remove('fhit'),1900)}},60);
  },
  go(s){this.s=s;document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));document.getElementById({patologie:'sp',farmaci:'sf',croniche:'sc',scores:'ss'}[s]).classList.add('active');document.querySelectorAll('.ni').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));this.r()},
  sa(a){this.a=a;const m={all:0,adulti:1,pediatrico:2};document.querySelectorAll('.fc').forEach((b,i)=>b.setAttribute('aria-pressed',i===m[a]));this.r()},
  hs(v){clearTimeout(this.t);this.t=setTimeout(()=>{const q=v.trim();if(q===this.lq)return;this.lq=q;if(q.length===1)return;this.r(q)},180)},
  r(fi){
    const q=fi??document.getElementById('si').value.trim(),nr=document.getElementById('nr');
    if(q.length>=2){
      let has=false;document.querySelectorAll('.sec').forEach(s=>{s.style.display='block';s.classList.add('active')});
      const ph=rP(PAT,q,this.a),fh=rF(FARM,q,this.a),ch=rC(CRON,q),sh=rS(SCO,q);
      document.getElementById('sp').innerHTML=ph;document.getElementById('sf').innerHTML=fh;document.getElementById('sc').innerHTML=ch;document.getElementById('ss').innerHTML=sh;
      has=!!(ph||fh||ch||sh);nr.classList.toggle('hidden',has)
    }else{
      document.querySelectorAll('.sec').forEach(s=>{s.style.display='none';s.classList.remove('active')});
      const id={patologie:'sp',farmaci:'sf',croniche:'sc',scores:'ss'}[this.s],el=document.getElementById(id);el.style.display='block';el.classList.add('active');nr.classList.add('hidden');
      if(this.s==='patologie')el.innerHTML=rP(PAT,'',this.a);else if(this.s==='farmaci')el.innerHTML=rF(FARM,'',this.a);else if(this.s==='croniche')el.innerHTML=rC(CRON,'');else if(this.s==='scores')el.innerHTML=rS(SCO,'')}
    this.quick();},
  sec(btn,i,k){const p=PAT[i];if(!p)return;const t=secTxt(p,k);if(!t)return;if(k==='dim'||k==='all')cc(btn,t);else ccIco(btn,t)},
  cf(n,a){const f=FARM.find(x=>x.n===n&&x.a===a);if(!f)return;let t=`${f.n} (${f.g}) ${f.fo}\n`;f.d.forEach(x=>t+=`${x.i}: ${dk(x.p,false)}\n`);if(f.w.length){t+='\nATTENZIONE:\n';f.w.forEach(w=>t+=`- ${w}\n`)}cc(event.currentTarget,t+kgn())}
};

/* il tema va applicato subito, prima del login */
A.theme(lsG('theme',(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));

function startApp(){
  PATI=new Map();PAT.forEach((p,i)=>PATI.set(p,i));
  buildFidx();
  const k=lsG('kg','');
  A.r();
  if(k)A.setKg(k);
  /* scorciatoie: / o Ctrl+K per cercare, Esc per pulire */
  document.addEventListener('keydown',e=>{
    const si=document.getElementById('si');
    if((e.key==='/'&&e.target.tagName!=='INPUT')||((e.ctrlKey||e.metaKey)&&e.key==='k')){e.preventDefault();si.focus();si.select()}
    else if(e.key==='Escape'&&document.activeElement===si){si.value='';A.lq='';A.r('')}
  });
}
