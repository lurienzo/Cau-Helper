<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CAU Helper - Riferimento Clinico">
<meta name="theme-color" content="#6366f1">
<title>CAU Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#f4f5f7;--sf:#fff;--sf2:#fafbfc;--bd:#e2e4e9;--bdl:#eff0f3;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af;--ac:#6366f1;--ach:#4f46e5;--acl:#eef2ff;--ok:#10b981;--okl:#ecfdf5;--wn:#f59e0b;--wnl:#fffbeb;--dg:#ef4444;--dgl:#fef2f2;--r-s:8px;--r-m:12px;--r-l:16px;--r-f:9999px;--sh-s:0 1px 2px rgba(0,0,0,.04);--sh-m:0 2px 8px rgba(0,0,0,.06),0 0 1px rgba(0,0,0,.08);--sh-l:0 8px 24px rgba(0,0,0,.08);--ease:cubic-bezier(.4,0,.2,1);--font:'Inter',system-ui,-apple-system,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:var(--r-s)}
mark{background:#fef08a;padding:1px 3px;border-radius:3px}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:2000px}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* HEADER */
.hdr{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#a78bfa 100%);position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(79,70,229,.35)}
.hdr-in{max-width:1320px;margin:0 auto;padding:16px 24px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-m{width:40px;height:40px;background:rgba(255,255,255,.15);backdrop-filter:blur(16px);border-radius:var(--r-m);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.2);transition:transform .3s var(--ease)}.logo-m:hover{transform:scale(1.08)}.logo-m svg{width:22px;height:22px;fill:#fff}
.logo h1{font-size:1.1rem;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.2}
.logo span{font-size:.72rem;color:rgba(255,255,255,.65);font-weight:500}
.srch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:var(--r-m);padding:10px 16px;flex:1;max-width:480px;transition:all .2s var(--ease)}
.srch:focus-within{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.srch svg{width:18px;height:18px;fill:rgba(255,255,255,.5);flex-shrink:0}
.srch input{background:none;border:none;color:#fff;font:500 .875rem/1 var(--font);width:100%;outline:none}
.srch input::placeholder{color:rgba(255,255,255,.45)}
nav.nb{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.ni{padding:8px 20px;border-radius:var(--r-m);cursor:pointer;font:600 .8rem/1 var(--font);background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.08);transition:all .25s var(--ease);min-height:36px;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.ni:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.ni:active{transform:translateY(0) scale(.97)}
.ni[aria-selected="true"]{background:#fff;color:var(--ac);border-color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.1);font-weight:700}
.fb{display:flex;gap:6px;margin-top:10px}
.fc{padding:5px 14px;border-radius:var(--r-s);cursor:pointer;font:700 .72rem/1 var(--font);text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);transition:all .2s var(--ease)}
.fc:hover{background:rgba(255,255,255,.12)}
.fc[aria-pressed="true"]{background:rgba(255,255,255,.92);color:var(--ac);border-color:rgba(255,255,255,.92)}

/* MAIN */
.mn{max-width:1320px;margin:0 auto;padding:24px}
.sec{display:none;animation:fadeIn .25s var(--ease)}.sec.active{display:block}

/* CAT GROUP */
.cg{margin-bottom:16px;border-radius:var(--r-l);background:var(--sf);box-shadow:var(--sh-m);border:1px solid var(--bdl);overflow:hidden;transition:box-shadow .3s var(--ease)}
.cg:hover{box-shadow:var(--sh-l)}
.ch{padding:16px 24px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:14px;transition:all .25s var(--ease);border-bottom:1px solid transparent}
.ch:hover{background:var(--sf2)}
.ch:active{transform:scale(.995)}
.cg.open .ch{border-bottom-color:var(--bdl)}
.ci{width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;flex-shrink:0;transition:transform .3s var(--ease)}.ci svg{width:22px;height:22px}
.cg.open .ci{transform:scale(1.08)}
.ch h2{font:700 .95rem/1.3 var(--font);flex:1;letter-spacing:-.02em}
.cc{font:700 .72rem/1 var(--font);padding:4px 12px;border-radius:var(--r-f);background:var(--bg);color:var(--tx2);transition:all .2s var(--ease)}
.cg.open .cc{background:var(--acl);color:var(--ac)}
.cv{width:20px;height:20px;fill:var(--tx3);transition:transform .35s var(--ease);flex-shrink:0}
.cg.open .cv{transform:rotate(180deg)}
.cb{display:none;padding:8px 16px 16px}.cg.open .cb{display:block;animation:fadeIn .3s var(--ease)}

/* PAT CARD */
.pc{border:1px solid var(--bdl);border-radius:var(--r-m);margin-bottom:8px;transition:all .25s var(--ease);overflow:hidden}
.pc:hover{box-shadow:var(--sh-s);border-color:var(--bd)}
.pc.open{border-color:var(--ac);border-left:3px solid var(--ac);box-shadow:0 2px 12px rgba(99,102,241,.08)}
.ph{padding:12px 16px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;transition:all .2s var(--ease);min-height:44px}
.ph:hover{background:var(--sf2)}
.ph:active{transform:scale(.998)}
.ph h3{font:600 .875rem/1.3 var(--font);flex:1;transition:color .2s}
.pc.open .ph h3{color:var(--ac)}
.pv{width:16px;height:16px;fill:var(--tx3);transition:all .3s var(--ease);flex-shrink:0}
.pc.open .pv{transform:rotate(180deg);fill:var(--ac)}
.pb{display:none;padding:0 16px 16px}.pc.open .pb{display:block;animation:fadeIn .3s var(--ease)}

/* BADGES */
.bg{font:700 .72rem/1 var(--font);padding:3px 8px;border-radius:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.bg-a{background:var(--acl);color:var(--ac)}.bg-p{background:#fdf2f8;color:#db2777}
.bg-d{background:var(--dgl);color:var(--dg)}.bg-w{background:var(--wnl);color:#b45309}

/* CLINICAL */
.wu{background:var(--sf2);border:1px solid var(--bdl);border-radius:var(--r-s);padding:10px 14px;font-size:.8rem;color:var(--tx2);margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.wu strong{color:var(--tx);font-weight:600}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.cx{border-radius:var(--r-s);padding:14px;font-size:.8rem;line-height:1.65}
.cx h5{font:700 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cx ul{padding-left:16px;margin:0}.cx li{margin-bottom:2px}
.cs{background:#faf5ff;border:1px solid #e9d5ff}.cs h5{color:#7c3aed}
.ce{background:#ecfeff;border:1px solid #a5f3fc}.ce h5{color:#0891b2}
.rf{background:var(--dgl);border:1px solid #fecdd3;border-radius:var(--r-s);padding:14px;margin-bottom:16px;font-size:.8rem;line-height:1.6}
.rf h5{font:700 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--dg);margin-bottom:8px}
.rf ul{padding-left:16px;margin:0}.rf li{margin-bottom:2px;color:#991b1b}
.sl{font:700 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bdl)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tx{border-radius:var(--r-s);padding:14px;font-size:.8rem;line-height:1.65}
.tx h5{font:700 .68rem/1 var(--font);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tx h5 .dt{width:8px;height:8px;border-radius:var(--r-f);flex-shrink:0}
.tf{background:#f7f8fc;border:1px solid #e0e4f0}.tf h5{color:var(--ac)}.tf h5 .dt{background:var(--ac)}
.tl{background:#f0faf4;border:1px solid #bbf7d0}.tl h5{color:var(--ok)}.tl h5 .dt{background:var(--ok)}
.ab{border-radius:var(--r-s);padding:10px 14px;margin-top:8px;font-size:.8rem;line-height:1.55;display:flex;align-items:flex-start;gap:10px}
.ab .ai{font-size:1rem;flex-shrink:0;margin-top:1px}
.ad{background:var(--dgl);border:1px solid #fecdd3;color:#991b1b}
.aw{background:var(--wnl);border:1px solid #fde68a;color:#92400e}
.ao{background:var(--acl);border:1px solid #c7d2fe;color:#3730a3}
.rv{background:#fff7ed;border:1px solid #fed7aa;border-radius:var(--r-s);padding:10px 14px;margin-top:8px;font-size:.8rem;color:#9a3412;display:flex;gap:8px}
.cp{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--font);padding:7px 16px;border:1px solid var(--bd);background:var(--sf);border-radius:var(--r-s);cursor:pointer;color:var(--tx2);transition:all .25s var(--ease);margin-top:10px}
.cp:hover{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 8px rgba(99,102,241,.25);transform:translateY(-1px)}.cp:active{transform:translateY(0) scale(.95)}

/* DRUG */
.di{background:var(--sf);border:1px solid var(--bdl);border-radius:var(--r-m);padding:14px 16px;margin-bottom:8px;transition:all .25s var(--ease)}
.di:hover{box-shadow:var(--sh-m);border-color:var(--bd);transform:translateY(-1px)}.di.fl{border-left:3px solid var(--wn)}
.dn{font:700 .95rem/1.3 var(--font);color:var(--ac)}
.ds{font-size:.8rem;color:var(--tx3);margin-top:2px}
.dd{font-size:.8rem;margin-top:6px}.dd b{color:var(--tx);font-weight:600}
.dw{font-size:.8rem;color:var(--dg);margin-top:6px;font-weight:600}
.dg{font-size:.72rem;margin-top:6px;padding:4px 10px;border-radius:var(--r-s);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.dg.go{background:var(--okl);color:var(--ok)}.dg.no{background:var(--wnl);color:#92400e}

/* SCORE */
.sc{background:var(--sf);border:1px solid var(--bdl);border-radius:var(--r-l);padding:24px;margin-bottom:16px;box-shadow:var(--sh-s)}
.sc h3{font:700 .95rem/1.3 var(--font);margin-bottom:4px}
.sc .sd{font-size:.8rem;color:var(--tx2);margin-bottom:16px}

/* PATHWAY */
.pw{background:var(--sf2);border-radius:var(--r-s);padding:16px;margin-bottom:8px}
.pw h4{font:700 .875rem/1.3 var(--font);color:var(--ac);margin-bottom:8px}
.pw p,.pw li{font-size:.8rem}.pw ul{padding-left:20px}
.st{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.sn{background:var(--ac);color:#fff;width:24px;height:24px;border-radius:var(--r-f);display:grid;place-items:center;font:800 .72rem/1 var(--font);flex-shrink:0}
.it{width:100%;border-collapse:separate;border-spacing:0;font-size:.8rem;margin:8px 0;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--bd)}
.it th{background:var(--ac);color:#fff;padding:8px 14px;text-align:left;font:600 .8rem/1.3 var(--font)}
.it td{padding:8px 14px;border-bottom:1px solid var(--bdl)}.it tr:last-child td{border-bottom:none}.it tr:hover td{background:var(--acl)}

/* CAT COLORS */
.ci-cardio{background:#fee2e2;color:#dc2626}.ci-derm{background:#fce7f3;color:#db2777}
.ci-gastro{background:#fef3c7;color:#d97706}.ci-pneumo{background:#dbeafe;color:#2563eb}
.ci-neuro{background:#ede9fe;color:#7c3aed}.ci-orl{background:#ccfbf1;color:#0d9488}
.ci-orto{background:#fed7aa;color:#ea580c}.ci-trauma{background:#e0e7ff;color:#4338ca}
.ci-uro{background:#cffafe;color:#0891b2}.ci-oftalm{background:#e0f2fe;color:#0284c7}
.ci-infett{background:#fef9c3;color:#a16207}.ci-gine{background:#fce7f3;color:#be185d}
.ci-emat{background:#ffe4e6;color:#e11d48}.ci-psic{background:#f3e8ff;color:#9333ea}
.ci-proct{background:#fff1f2;color:#be123c}.ci-odont{background:#f0fdf4;color:#16a34a}
.ci-other{background:#f1f5f9;color:#475569}

/* NORES */
.nr{text-align:center;padding:80px 20px;color:var(--tx3)}
.nr svg{width:56px;height:56px;fill:var(--bd);margin-bottom:14px}.nr p{font:500 .95rem/1 var(--font)}

/* RESPONSIVE */
@media(max-width:1024px){.mn{padding:16px}}
@media(max-width:768px){.hdr-in{padding:12px 16px}.hdr-top{flex-direction:column;align-items:stretch}.srch{max-width:100%}.cg2,.tg{grid-template-columns:1fr}.ch{padding:12px 14px}.ci{width:36px;height:36px;font-size:1.1rem}}
@media(max-width:480px){.nb{gap:4px}.ni{padding:7px 12px;font-size:.72rem}.ph{padding:10px 12px}.pb{padding:0 12px 12px}}

/* LOGIN */
.login-overlay {
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 40%,#a78bfa 70%,#c4b5fd 100%);
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.login-card {
  background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:24px;
  padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.15);text-align:center;
  animation:loginUp .6s cubic-bezier(.22,1,.36,1);
}
@keyframes loginUp{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo {
  width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:18px;
  display:grid;place-items:center;font-size:1.8rem;color:#fff;font-weight:800;
  margin:0 auto 20px;box-shadow:0 8px 24px rgba(99,102,241,.3);
}
.login-card h2{font:800 1.4rem/1.2 var(--font);color:var(--tx);letter-spacing:-.03em;margin-bottom:6px}
.login-card p{font:400 .85rem/1.5 var(--font);color:var(--tx2);margin-bottom:28px}
.login-field{position:relative;margin-bottom:16px}
.login-field input{width:100%;padding:14px 18px 14px 48px;border:2px solid var(--bd);border-radius:14px;font:500 .95rem/1 var(--font);color:var(--tx);background:var(--sf);outline:none;transition:border-color .2s,box-shadow .2s}
.login-field input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.login-field input::placeholder{color:var(--tx3)}
.login-field .fi{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:var(--tx3)}
.login-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font:700 .95rem/1 var(--font);cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(99,102,241,.3)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(99,102,241,.4)}
.login-btn:active{transform:translateY(0) scale(.98)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{font:600 .8rem/1.4 var(--font);color:var(--dg);margin-top:12px;min-height:20px}
.login-hint{font:400 .72rem/1.4 var(--font);color:var(--tx3);margin-top:20px}
.login-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.login-card{padding:36px 24px;margin:16px;border-radius:20px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
<div class="login-card">
<div class="login-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="32" height="32" fill="#fff"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></div>
<h2>CAU Helper</h2>
<p>Inserisci la password per accedere</p>
<form id="loginForm">
<div class="login-field">
<svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
<input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" autofocus aria-label="Password">
</div>
<button type="submit" class="login-btn" id="loginBtn">Accedi</button>
<div class="login-error" id="loginError">&nbsp;</div>
</form>
<div class="login-hint">Dati protetti con crittografia AES-256</div>
</div>
</div>

<!-- APP -->
<div id="appContainer" style="display:none">
<header class="hdr" role="banner"><div class="hdr-in">
<div class="hdr-top">
<div class="logo"><div class="logo-m" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></div><div><h1>CAU Helper</h1><span>Riferimento Clinico</span></div></div>
<div class="srch" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="si" placeholder="Cerca patologia, farmaco, diagnosi..." aria-label="Cerca nella knowledge base" oninput="A.hs(this.value)"></div>
</div>
<nav class="nb" aria-label="Sezioni principali">
<button class="ni" aria-selected="true" data-s="patologie" onclick="A.go('patologie')">Per Patologia</button>
<button class="ni" aria-selected="false" data-s="farmaci" onclick="A.go('farmaci')">Farmaci</button>
<button class="ni" aria-selected="false" data-s="croniche" onclick="A.go('croniche')">Croniche</button>
<button class="ni" aria-selected="false" data-s="scores" onclick="A.go('scores')">Score</button>
</nav>
<div class="fb" role="radiogroup" aria-label="Filtro eta">
<button class="fc" aria-pressed="true" onclick="A.sa('all')">Tutti</button>
<button class="fc" aria-pressed="false" onclick="A.sa('adulti')">Adulti</button>
<button class="fc" aria-pressed="false" onclick="A.sa('pediatrico')">Pediatrici</button>
<span style="width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px"></span>
<button class="fc" id="togAll" onclick="A.tog()" aria-label="Espandi o comprimi tutto">Espandi tutto</button>
</div>
</div></header>
<main class="mn" role="main">
<div class="sec active" id="sp" aria-label="Patologie"></div>
<div class="sec" id="sf" aria-label="Farmaci"></div>
<div class="sec" id="sc" aria-label="Croniche"></div>

const VERIFY_TOKEN = "LqH7TgxrcbbrznmbQ0EZjSW0WQ0STgt5Szzj/xPobd9KJa027DNQ9UrCQh4N4TaA";

/* CRYPTO */
async function deriveKey(password, salt) {
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
}

async function verifyPassword(password) {
  var raw = Uint8Array.from(atob(VERIFY_TOKEN), function(c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16);
  var expectedHash = raw.slice(16);
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  var derivedBits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, 256
  );
  var derived = new Uint8Array(derivedBits);
  return derived.every(function(b, i) { return b === expectedHash[i]; });
}

async function decryptData(password) {
  var raw = Uint8Array.from(atob(ENCRYPTED_PAYLOAD), function(c) { return c.charCodeAt(0); });
  var salt = raw.slice(0, 16);
  var iv = raw.slice(16, 28);
  var ciphertext = raw.slice(28);
  var key = await deriveKey(password, salt);
  var decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
  return new TextDecoder().decode(decrypted);
}

/* LOGIN */
async function handleLogin() {
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('loginError');
  if (!pass) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="login-spinner"></span>Verifica...';
  errEl.innerHTML = '&nbsp;';

  try {
    var valid = await verifyPassword(pass);
    if (!valid) {
      errEl.textContent = 'Password non corretta';
      btn.disabled = false;
      btn.textContent = 'Accedi';
      document.getElementById('loginPass').select();
      return;
    }

    btn.innerHTML = '<span class="login-spinner"></span>Decifratura...';
    var dataJs = await decryptData(pass);

    // Replace const with var for global scope eval
    dataJs = dataJs.replace(/\bconst\b/g, 'var');

    // Execute at global scope
    (0, eval)(dataJs);

    // Save to session (persists until browser closes)
    sessionStorage.setItem('cau_pass', pass);

    // Hide login, show app
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';

    // Start the app rendering
    startApp();

  } catch (err) {
    console.error('Login error:', err);
    errEl.textContent = 'Errore: ' + err.message;
    btn.disabled = false;
    btn.textContent = 'Accedi';
  }
}

// Attach login handler
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  handleLogin();
});

// Auto-login if session exists
(async function() {
  var saved = sessionStorage.getItem('cau_pass');
  if (!saved) return;
  try {
    var valid = await verifyPassword(saved);
    if (!valid) { sessionStorage.removeItem('cau_pass'); return; }
    var dataJs = await decryptData(saved);
    dataJs = dataJs.replace(/\bconst\b/g, 'var');
    (0, eval)(dataJs);
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    startApp();
  } catch(e) { sessionStorage.removeItem('cau_pass'); }
})();

/* APP LOGIC (global scope - onclick handlers need access) */
const CV='<svg class="cv" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';
const PV='<svg class="pv" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';

function cm(c){return CAT_META[c]||{icon:"&#10070;",css:"ci-other"}}
function hl(t,q){if(!q||q.length<2)return t;const s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return t.replace(new RegExp(`(${s})`,'gi'),'<mark>$1</mark>')}
function mq(t,q){return t.toLowerCase().includes(q)}
function te(el){el.parentElement.classList.toggle('open')}
async function cc(btn,t){try{await navigator.clipboard.writeText(t);const o=btn.innerHTML;btn.innerHTML='&#10003; Copiato!';setTimeout(()=>btn.innerHTML=o,1500)}catch{btn.textContent='Errore';setTimeout(()=>btn.textContent='Copia',1500)}}
function bl(items,q){return'<ul>'+items.map(i=>`<li>${hl(i,q)}</li>`).join('')+'</ul>'}

function rP(data,fi,age){
  const q=fi.toLowerCase(),gr={};
  data.forEach(p=>{
    if(age!=='all'&&p.a!==age)return;
    if(fi.length>=2){const f=[p.n,p.c,p.f,p.g,p.w||''],ar=[...(p.s||[]),...(p.eo||[]),...(p.rf||[])];if(!f.some(x=>mq(x,q))&&!ar.some(x=>mq(x,q)))return}
    if(!gr[p.c])gr[p.c]=[];gr[p.c].push(p)});
  if(!Object.keys(gr).length)return'';
  let h='';
  for(const[cat,items]of Object.entries(gr)){
    const m=cm(cat),dc=items.reduce((s,p)=>s+(p.al?p.al.filter(a=>a.t==='danger').length:0),0),o=fi.length>=2?' open':'';
    h+=`<div class="cg${o}"><div class="ch" onclick="te(this)" role="button" aria-expanded="${o?'true':'false'}"><div class="ci ${m.css}" aria-hidden="true">${m.icon}</div><h2>${cat}</h2><span class="cc">${items.length}</span>${dc?`<span class="bg bg-d">${dc} alert</span>`:''}${CV}</div><div class="cb">`;
    items.forEach(p=>{
      const pd=p.al?p.al.filter(a=>a.t==='danger').length:0,pw=p.al?p.al.filter(a=>a.t==='warn').length:0,co=fi.length>=2?' open':'';
      h+=`<div class="pc${co}"><div class="ph" onclick="te(this)" role="button" aria-expanded="${co?'true':'false'}"><h3>${hl(p.n,fi)}</h3><span class="bg ${p.a==='pediatrico'?'bg-p':'bg-a'}">${p.a}</span>${pd?`<span class="bg bg-d">${pd}</span>`:pw?'<span class="bg bg-w">!</span>':''}${PV}</div><div class="pb">`;
      if(p.w)h+=`<div class="wu"><strong>Work-up:</strong> ${hl(p.w,fi)}</div>`;
      if(p.s||p.eo){h+='<div class="cg2">';if(p.s)h+=`<div class="cx cs"><h5>&#129657; Segni e Sintomi</h5>${bl(p.s,fi)}</div>`;if(p.eo)h+=`<div class="cx ce"><h5>&#129658; Esame Obiettivo</h5>${bl(p.eo,fi)}</div>`;h+='</div>'}
      if(p.rf&&p.rf.length)h+=`<div class="rf"><h5>&#9888; Red Flags</h5>${bl(p.rf,fi)}</div>`;
      h+='<div class="sl">Terapia: confronto foglio vs linee guida</div><div class="tg">';
      h+=`<div class="tx tf"><h5><span class="dt"></span>Da Foglio</h5>${hl(p.f,fi).replace(/\n/g,'<br>')}</div>`;
      h+=`<div class="tx tl"><h5><span class="dt"></span>Da Linee Guida</h5>${hl(p.g,fi).replace(/\n/g,'<br>')}</div></div>`;
      if(p.al)p.al.forEach(a=>{const c=a.t==='danger'?'ad':a.t==='warn'?'aw':'ao';h+=`<div class="ab ${c}"><span class="ai" aria-hidden="true">&#9888;</span><span>${a.x}</span></div>`});
      if(p.r)h+=`<div class="rv"><span aria-hidden="true">&#9888;</span><span><strong>Rivalutazione urgente:</strong> ${p.r}</span></div>`;
      h+=`<button class="cp" onclick="A.cp('${p.n.replace(/'/g,"\\'")}','${p.a}')" aria-label="Copia ${p.n}">&#128203; Copia</button></div></div>`});
    h+='</div></div>'}
  return h}

function rF(data,fi,age){
  const q=fi.toLowerCase(),gr={};
  data.forEach(f=>{if(age!=='all'&&f.a!==age)return;if(fi.length>=2&&!mq(f.n,q)&&!mq(f.g,q)&&!mq(f.c,q)&&!f.d.some(d=>mq(d.i,q)||mq(d.p,q)))return;if(!gr[f.c])gr[f.c]=[];gr[f.c].push(f)});
  if(!Object.keys(gr).length)return'';
  let h='';
  for(const[cat,ds]of Object.entries(gr)){
    const o=fi.length>=2?' open':'';
    h+=`<div class="cg${o}"><div class="ch" onclick="te(this)" role="button"><div class="ci ci-other" aria-hidden="true">&#9883;</div><h2>${cat}</h2><span class="cc">${ds.length}</span>${CV}</div><div class="cb">`;
    ds.forEach(d=>{
      h+=`<div class="di${d.ok===false?' fl':''}"><div class="dn">${hl(d.n,fi)} <span class="bg ${d.a==='pediatrico'?'bg-p':'bg-a'}">${d.a}</span></div><div class="ds">${hl(d.g,fi)} &mdash; ${d.fo}</div>`;
      d.d.forEach(x=>{h+=`<div class="dd"><b>${hl(x.i,fi)}:</b> ${hl(x.p,fi)}</div>`});
      d.w.forEach(w=>{h+=`<div class="dw">&#9888; ${hl(w,fi)}</div>`});
      if(d.gl)h+=`<div class="dg ${d.ok?'go':'no'}">${d.ok?'&#10003;':'&#9888;'} ${d.gl}</div>`;
      h+=`<button class="cp" onclick="A.cf('${d.n.replace(/'/g,"\\'")}','${d.a}')" aria-label="Copia ${d.n}">&#128203; Copia</button></div>`});
    h+='</div></div>'}
  return h}

function rC(data,fi){
  const q=fi.toLowerCase(),fs=data.filter(c=>fi.length<2||mq(c.n,q)||mq(c.h,q));
  if(!fs.length)return'';const gr={};fs.forEach(c=>{if(!gr[c.cat])gr[c.cat]=[];gr[c.cat].push(c)});
  let h='';for(const[cat,items]of Object.entries(gr)){
    const o=fi.length>=2?' open':'';
    h+=`<div class="cg${o}"><div class="ch" onclick="te(this)" role="button"><div class="ci ci-other" aria-hidden="true">&#10070;</div><h2>${cat}</h2><span class="cc">${items.length}</span>${CV}</div><div class="cb">`;
    items.forEach(c=>{const co=fi.length>=2?' open':'';h+=`<div class="pc${co}"><div class="ph" onclick="te(this)" role="button"><h3>${hl(c.n,fi)}</h3>${PV}</div><div class="pb">${c.h}</div></div>`});
    h+='</div></div>'}return h}

function rS(data,fi){
  const q=fi.toLowerCase(),fs=data.filter(s=>fi.length<2||mq(s.n,q)||mq(s.d,q));
  if(!fs.length)return'';return fs.map(s=>`<div class="sc"><h3>${hl(s.n,fi)}</h3><div class="sd">${hl(s.d,fi)}</div>${s.h}</div>`).join('')}

const A={
  s:'patologie',a:'all',t:null,lq:'',expanded:false,
  tog(){this.expanded=!this.expanded;const cls=this.expanded?'add':'remove';document.querySelectorAll('.cg,.pc').forEach(el=>el.classList[cls]('open'));document.getElementById('togAll').textContent=this.expanded?'Comprimi tutto':'Espandi tutto'},
  go(s){this.s=s;document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));document.getElementById({patologie:'sp',farmaci:'sf',croniche:'sc',scores:'ss'}[s]).classList.add('active');document.querySelectorAll('.ni').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));this.r()},
  sa(a){this.a=a;const m={all:0,adulti:1,pediatrico:2};document.querySelectorAll('.fc').forEach((b,i)=>b.setAttribute('aria-pressed',i===m[a]));this.r()},
  hs(v){clearTimeout(this.t);this.t=setTimeout(()=>{const q=v.trim();if(q===this.lq)return;this.lq=q;if(q.length===1)return;this.r(q)},180)},
  r(fi){
    const q=fi??document.getElementById('si').value.trim(),nr=document.getElementById('nr');
    if(q.length>=2){
      let has=false;document.querySelectorAll('.sec').forEach(s=>{s.style.display='block';s.classList.add('active')});
      const ph=rP(PAT,q,this.a),fh=rF(FARM,q,this.a),ch=rC(CRON,q),sh=rS(SCO,q);
      document.getElementById('sp').innerHTML=ph;document.getElementById('sf').innerHTML=fh;document.getElementById('sc').innerHTML=ch;document.getElementById('ss').innerHTML=sh;
      has=!!(ph||fh||ch||sh);nr.classList.toggle('hidden',has)
    }else{
      document.querySelectorAll('.sec').forEach(s=>{s.style.display='none';s.classList.remove('active')});
      const id={patologie:'sp',farmaci:'sf',croniche:'sc',scores:'ss'}[this.s],el=document.getElementById(id);el.style.display='block';el.classList.add('active');nr.classList.add('hidden');
      if(this.s==='patologie')el.innerHTML=rP(PAT,'',this.a);else if(this.s==='farmaci')el.innerHTML=rF(FARM,'',this.a);else if(this.s==='croniche')el.innerHTML=rC(CRON,'');else if(this.s==='scores')el.innerHTML=rS(SCO,'')}},
  cp(n,a){const p=PAT.find(x=>x.n===n&&x.a===a);if(!p)return;let t=`DIAGNOSI: ${p.n}\n`;if(p.w)t+=`\nWORK-UP: ${p.w}\n`;if(p.s?.length){t+='\nSEGNI E SINTOMI:\n';p.s.forEach(x=>t+=`- ${x}\n`)}if(p.eo?.length){t+='\nESAME OBIETTIVO:\n';p.eo.forEach(x=>t+=`- ${x}\n`)}if(p.rf?.length){t+='\nRED FLAGS:\n';p.rf.forEach(x=>t+=`- ${x}\n`)}t+=`\nTERAPIA:\n${p.f}\n`;if(p.al?.length){t+='\nNOTE LG:\n';p.al.forEach(a=>t+=`- [${a.t.toUpperCase()}] ${a.x}\n`)}if(p.r)t+=`\nRIVALUTAZIONE URGENTE SE: ${p.r}\n`;t+='\nSi rinvia il paziente al proprio Medico di Medicina Generale per proseguimento cure.';cc(event.currentTarget,t)},
  cf(n,a){const f=FARM.find(x=>x.n===n&&x.a===a);if(!f)return;let t=`${f.n} (${f.g}) ${f.fo}\n`;f.d.forEach(x=>t+=`${x.i}: ${x.p}\n`);if(f.w.length){t+='\nATTENZIONE:\n';f.w.forEach(w=>t+=`- ${w}\n`)}cc(event.currentTarget,t)}
};


function startApp() {
  A.r();
}
</script>
